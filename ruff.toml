target-version = "py312"
line-length = 100

exclude = [
    "verification",
    ".venv",
    ".git",
    "dist",
    "node_modules",
]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "N803", "N806", "B905", "B007", "B904", "B008"]

[lint.per-file-ignores]
"scripts/*" = ["E402", "TC003"]
"backend/tests/*" = ["E402"]

[lint.isort]
known-first-party = ["app"]
