[project]
name = "collaborative-fraud-intelligence"
version = "2.4.0"
description = "Privacy-preserving cross-institution fraud detection using Federated Learning"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "neo4j>=5.8.1,<6.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "flower>=2.0.0,<3.0.0",
    "torch>=2.4.0,<3.0.0",
    "opacus>=1.5.0,<2.0.0",
    "tenseal>=0.3.17,<1.0.0",
    "optuna>=4.0.0,<5.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "shap>=0.45.0,<1.0.0",
    "numba>=0.59.0; python_version >= '3.12'",
    "llvmlite>=0.42.0; python_version >= '3.12'",
    "mlflow>=3.17.2,<4.0.0",
    "pandera>=0.21.0,<1.0.0",
    "great_expectations>=1.21.0,<2.0.0",
    "lxml>=5.0.0",
    "defusedxml>=0.7.1",
    "flwr>=1.12.0,<2.0.0",
    "ray>=2.56.0,<3.0.0",
    "websockets>=13.0,<18.0",
    "structlog>=24.4.0,<27.0.0",
    "python-json-logger>=2.0.7,<4.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    "pika>=1.3.0,<2.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "slowapi>=0.1.10,<1.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "kaggle>=1.6.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0.0",
    "starlette>=1.3.1",
    "protobuf>=5.29.6",
    "cryptography>=50.0.0",
    "urllib3>=2.8.0",
    "jinja2>=3.1.4",
    "aiohttp>=3.14.4",
    "tornado>=6.6",
    "certifi>=2026.10.18",
    "setuptools>=84.1.0",
    "werkzeug>=3.1.9",
    "opentelemetry-api>=1.45.1,<2.0.0",
    "opentelemetry-sdk>=1.45.1,<2.0.0",
    "opentelemetry-exporter-otlp>=1.45.1,<2.0.0",
    "opentelemetry-exporter-prometheus>=0.66b1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "prometheus-client>=0.21.0,<1.0.0",
    "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "httpx2>=2.0.0",
    "hypothesis>=6.0.0,<7.0.0",
    "locust>=2.32.0,<3.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.12.0,<2.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
cfi-cli = "app.presentation.cli.cfi_cli:main"


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "N803", "N806", "B905", "B007", "B904", "B008", "TC001", "TC002", "TC003", "N815", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
extraPaths = [
    "..",
    "../runtime_truth_guard",
    "../.runtime_truth_guard",
    "../verification",
    "../sdk/python",
    "."
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "redis.*",
    "alembic",
    "alembic.*",
    "tenseal.*",
    "opacus.*",
    "shap.*",
    "optuna.*",
    "pandas",
    "pandas.*",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "networkx",
    "networkx.*",
    "defusedxml",
    "defusedxml.*",
    "great_expectations",
    "great_expectations.*",
    "pandera",
    "pandera.*",
    "pika",
    "pika.*",
    "prometheus_fastapi_instrumentator",
    "prometheus_fastapi_instrumentator.*",
    "zstandard",
    "zstandard.*",
    "pyarrow",
    "pyarrow.*",
    "experiments",
    "experiments.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "real_data: Tests that require physical empirical benchmark datasets on disk",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit.*:",
    "ignore::FutureWarning:torch.jit.*:",
    "ignore:.*:Warning:torch.jit.*:",
    "ignore::UserWarning:opacus.*:",
    "ignore::UserWarning:torch.sparse.*:",
    "ignore:.*Sparse invariant checks are implicitly disabled.*:UserWarning",
    "ignore::UserWarning:app.application.services.model_service:",
    "ignore::FutureWarning:ray._private.worker:",
    "ignore::PendingDeprecationWarning:shap.*:",
    "ignore::PendingDeprecationWarning:matplotlib.*:",
    "ignore:.*starlette\\.testclient.*:DeprecationWarning:",
    "ignore:.*starlette\\.testclient.*:",
    "ignore:.*Using .httpx. with .starlette.*:",
    "ignore:.*install .httpx2. instead.*:",
    "ignore:.*TestClient.*:DeprecationWarning:",
    "ignore:.*MessageMapContainer.*:DeprecationWarning:",
    "ignore:.*ScalarMapContainer.*:DeprecationWarning:",
    "ignore::urllib3.exceptions.DependencyWarning:",
    "ignore:.*click.utils.*:DeprecationWarning:",
    "ignore::DeprecationWarning:click.*:",
    "ignore::DeprecationWarning:typer.*:",
    "ignore:.*pythonjsonlogger.*:DeprecationWarning:",
    "ignore:.*Valid config keys have changed in V2.*:UserWarning:",
]
