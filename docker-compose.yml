version: '3.8'

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cfi-intelligence/backend:latest
    container_name: cfi-api-server
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "50051:50051"
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis-store:6379/0
      - TELEMETRY_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      redis-store:
        condition: service_healthy
    networks:
      - cfi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-store:
    image: redis:7.2-alpine
    container_name: cfi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cfi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: cfi-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    networks:
      - cfi-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: cfi-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cfi-network

  grafana:
    image: grafana/grafana-oss:10.3.3
    container_name: cfi-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - cfi-network

networks:
  cfi-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
