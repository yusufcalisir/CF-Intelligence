<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-indigo-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="logo-c-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="logo-f-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#logo-glow)" />

  <!-- Outer Dynamic Orbit Arc Particles -->
  <path d="M 20,70 A 45,45 0 0,1 45,20" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="3 4" opacity="0.6" />
  <circle cx="20" cy="70" r="2.5" fill="#c084fc" />
  <circle cx="45" cy="20" r="2.5" fill="#38bdf8" />

  <!-- Outer 'C' Arch -->
  <path d="M 78,26 C 58,16 34,22 24,38 C 12,58 14,76 28,88 C 42,100 66,98 82,86"
        fill="none"
        stroke="url(#logo-c-arc)"
        stroke-width="8"
        stroke-linecap="round"
        filter="url(#logo-shadow)" />

  <!-- Central Shield Network Region -->
  <polygon points="56,36 74,44 74,68 56,80 38,68 38,44"
           fill="#111827"
           fill-opacity="0.75"
           stroke="url(#logo-indigo-purple)"
           stroke-width="2.5"
           stroke-linejoin="round"
           filter="url(#logo-shadow)" />

  <!-- Internal Graph Neural Network Nodes & Connections -->
  <g stroke="url(#logo-indigo-purple)" stroke-width="1.5" opacity="0.85">
    <line x1="46" y1="50" x2="66" y2="48" />
    <line x1="66" y1="48" x2="60" y2="64" />
    <line x1="60" y1="64" x2="46" y2="50" />
    <line x1="46" y1="50" x2="50" y2="70" />
    <line x1="60" y1="64" x2="50" y2="70" />
  </g>

  <!-- Node Vertices -->
  <circle cx="46" cy="50" r="3.5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />
  <circle cx="66" cy="48" r="3.5" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="60" cy="64" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="50" cy="70" r="3" fill="#34d399" stroke="#ffffff" stroke-width="1" />

  <!-- Right 'F' Wings Structure -->
  <path d="M 64,32 L 96,32 L 86,44 L 64,44 Z" fill="url(#logo-f-beam)" filter="url(#logo-shadow)" />
  <path d="M 64,52 L 90,52 L 80,64 L 64,64 Z" fill="url(#logo-f-beam)" filter="url(#logo-shadow)" />
  <path d="M 64,32 L 64,90 L 54,90 L 54,32 Z" fill="url(#logo-f-beam)" filter="url(#logo-shadow)" />

  <!-- Pixel Dispersion Accent Particles -->
  <rect x="94" y="66" width="3" height="3" fill="#a855f7" opacity="0.8" />
  <rect x="100" y="60" width="3.5" height="3.5" fill="#38bdf8" opacity="0.9" />
  <rect x="98" y="74" width="2.5" height="2.5" fill="#818cf8" opacity="0.7" />
</svg>