<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cfi-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cfi-shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <filter id="cfi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#030712" stroke="url(#cfi-border-grad)" stroke-width="3" />

  <!-- Background Cyber Mesh Pattern -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.35">
    <line x1="60" y1="18" x2="60" y2="102" />
    <line x1="18" y1="60" x2="102" y2="60" />
  </g>

  <!-- High-Tech Shield Outline -->
  <path d="M 60,22 C 78,22 92,26 94,36 C 94,62 82,88 60,98 C 38,88 26,62 26,36 C 28,26 42,22 60,22 Z"
        fill="url(#cfi-shield-grad)"
        stroke="url(#cfi-border-grad)"
        stroke-width="3.5"
        stroke-linejoin="round"
        filter="url(#cfi-glow)" />

  <!-- Federated Node Interconnects (3 Banks + Enclave Core) -->
  <g stroke="#818cf8" stroke-width="2" opacity="0.75">
    <line x1="60" y1="36" x2="38" y2="54" />
    <line x1="60" y1="36" x2="82" y2="54" />
    <line x1="38" y1="54" x2="60" y2="76" />
    <line x1="82" y1="54" x2="60" y2="76" />
    <line x1="60" y1="36" x2="60" y2="56" />
    <line x1="38" y1="54" x2="60" y2="56" />
    <line x1="82" y1="54" x2="60" y2="56" />
    <line x1="60" y1="76" x2="60" y2="56" />
  </g>

  <!-- Outer Node Vertices -->
  <circle cx="60" cy="36" r="4.5" fill="#38bdf8" />
  <circle cx="38" cy="54" r="4.5" fill="#6366f1" />
  <circle cx="82" cy="54" r="4.5" fill="#ec4899" />
  <circle cx="60" cy="76" r="4.5" fill="#10b981" />

  <!-- Central Intel SGX Enclave Core Node -->
  <circle cx="60" cy="56" r="7.5" fill="#a855f7" stroke="#ffffff" stroke-width="2" filter="url(#cfi-glow)" />
  <circle cx="60" cy="56" r="3" fill="#ffffff" />
</svg>
