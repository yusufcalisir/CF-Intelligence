<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cfi-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cfi-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cfi-f-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="cfi-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="cfi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Layer (transparent bg) -->
  <circle cx="60" cy="60" r="48" fill="url(#cfi-core-glow)" />

  <!-- Interconnected Neural Node Network Beams -->
  <g stroke="url(#cfi-border-grad)" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="34" y1="38" x2="86" y2="36" />
    <line x1="34" y1="38" x2="34" y2="82" />
    <line x1="34" y1="82" x2="86" y2="36" />
    <line x1="78" y1="58" x2="34" y2="38" />
  </g>

  <!-- Futuristic Geometric 'C' Curve Path -->
  <path d="M 84,36 C 68,22 42,22 32,38 C 22,54 22,66 32,82 C 42,98 68,98 84,84"
        fill="none"
        stroke="url(#cfi-c-grad)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#cfi-glow)" />

  <!-- Interlocking Futuristic 'F' Monogram -->
  <path d="M 52,36 L 86,36 M 52,36 L 52,84 M 52,58 L 78,58"
        fill="none"
        stroke="url(#cfi-f-grad)"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#cfi-glow)" />

  <!-- Federated Consortium Node Vertices -->
  <circle cx="32" cy="38" r="4.5" fill="#818cf8" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="86" cy="36" r="4.5" fill="#c084fc" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="78" cy="58" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="32" cy="82" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="84" cy="84" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1.2" />

  <!-- Central TEE Enclave Cryptographic Node -->
  <circle cx="60" cy="60" r="7" fill="none" stroke="url(#cfi-border-grad)" stroke-width="2.5" filter="url(#cfi-glow)" />
  <circle cx="60" cy="60" r="3" fill="#38bdf8" />
</svg>
