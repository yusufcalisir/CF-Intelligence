groups:
  - name: cfi_platform_alerts
    rules:
      - alert: CFI_HighInferenceLatency
        expr: histogram_quantile(0.95, sum(rate(cfi_inference_latency_ms_bucket[5m])) by (le)) > 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Real-time inference p95 scoring latency exceeds 100ms SLA threshold"
          description: "P95 transaction scoring latency has been above 100ms for more than 2 minutes."

      - alert: CFI_QuorumRisk
        expr: cfi_active_bank_nodes < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Federated Consortium Quorum Risk (Active Banks < 2)"
          description: "Count of active participating bank nodes has dropped below minimum quorum (2 nodes) for 5 minutes."

      - alert: CFI_DPBudgetDepleting
        expr: cfi_dp_epsilon_consumed_total > 6.4
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Differential Privacy Epsilon Budget Depleting (> 80% used)"
          description: "Cumulative differential privacy epsilon consumed has exceeded 80% (6.4 / 8.0) of maximum round budget."

      - alert: CFI_ModelDrift
        expr: cfi_champion_model_auc < 0.75
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Champion Model Performance Drift (AUC < 0.75)"
          description: "Active champion global model holdout evaluation AUC score dropped below critical quality threshold 0.75."
