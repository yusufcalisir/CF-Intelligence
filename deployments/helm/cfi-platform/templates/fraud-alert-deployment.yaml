apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-fraud-alert"
  labels:
    app.kubernetes.io/name: cfi-fraud-alert
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: fraud-alert
    app.kubernetes.io/part-of: cfi-platform
spec:
  replicas: {{ .Values.fraudAlert.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cfi-fraud-alert
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cfi-fraud-alert
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: fraud-alert
    spec:
      containers:
        - name: fraud-alert
          image: "{{ .Values.fraudAlert.image.repository }}:{{ .Values.fraudAlert.image.tag }}"
          imagePullPolicy: {{ .Values.fraudAlert.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.fraudAlert.service.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.fraudAlert.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.fraudAlert.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fraudAlert.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.fraudAlert.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.fraudAlert.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fraudAlert.probes.readiness.periodSeconds }}
          resources:
            requests:
              cpu: {{ .Values.fraudAlert.resources.requests.cpu }}
              memory: {{ .Values.fraudAlert.resources.requests.memory }}
            limits:
              cpu: {{ .Values.fraudAlert.resources.limits.cpu }}
              memory: {{ .Values.fraudAlert.resources.limits.memory }}
