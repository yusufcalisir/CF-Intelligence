apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Release.Name }}-coordinator-hpa"
  labels:
    app.kubernetes.io/name: cfi-coordinator
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: coordinator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "{{ .Release.Name }}-coordinator"
  minReplicas: {{ .Values.coordinator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.coordinator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.coordinator.autoscaling.targetCPUUtilizationPercentage }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Release.Name }}-fraud-alert-hpa"
  labels:
    app.kubernetes.io/name: cfi-fraud-alert
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: fraud-alert
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: "{{ .Release.Name }}-fraud-alert"
  minReplicas: {{ .Values.fraudAlert.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fraudAlert.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fraudAlert.autoscaling.targetCPUUtilizationPercentage }}
