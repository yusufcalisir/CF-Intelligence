{{- if .Values.coordinator.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cfi-platform.fullname" . }}-coordinator-hpa
  labels:
    app.kubernetes.io/component: coordinator
    {{- include "cfi-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cfi-platform.fullname" . }}-coordinator
  minReplicas: {{ .Values.coordinator.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.coordinator.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.coordinator.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.fraudAlert.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cfi-platform.fullname" . }}-fraud-alert-hpa
  labels:
    app.kubernetes.io/component: fraud-alert
    {{- include "cfi-platform.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cfi-platform.fullname" . }}-fraud-alert
  minReplicas: {{ .Values.fraudAlert.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fraudAlert.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fraudAlert.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
