apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-identity-graph"
  labels:
    app.kubernetes.io/name: cfi-identity-graph
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: identity-graph
    app.kubernetes.io/part-of: cfi-platform
spec:
  replicas: {{ .Values.identityGraph.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cfi-identity-graph
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cfi-identity-graph
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: identity-graph
    spec:
      containers:
        - name: identity-graph
          image: "{{ .Values.identityGraph.image.repository }}:{{ .Values.identityGraph.image.tag }}"
          imagePullPolicy: {{ .Values.identityGraph.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.identityGraph.service.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.identityGraph.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.identityGraph.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.identityGraph.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.identityGraph.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.identityGraph.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.identityGraph.probes.readiness.periodSeconds }}
          resources:
            requests:
              cpu: {{ .Values.identityGraph.resources.requests.cpu }}
              memory: {{ .Values.identityGraph.resources.requests.memory }}
            limits:
              cpu: {{ .Values.identityGraph.resources.limits.cpu }}
              memory: {{ .Values.identityGraph.resources.limits.memory }}
