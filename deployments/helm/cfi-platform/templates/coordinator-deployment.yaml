apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cfi-platform.fullname" . }}-coordinator
  labels:
    app.kubernetes.io/component: coordinator
    {{- include "cfi-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: coordinator
      {{- include "cfi-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: coordinator
        {{- include "cfi-platform.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.coordinator.service.grpcPort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.coordinator.service.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.coordinator.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.coordinator.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.coordinator.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.coordinator.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.coordinator.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.coordinator.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
