apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ .Release.Name }}-coordinator-ingress"
  labels:
    app.kubernetes.io/name: cfi-coordinator
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/component: coordinator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cfi-coordinator
      app.kubernetes.io/instance: "{{ .Release.Name }}"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bank-client
      ports:
        - protocol: TCP
          port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ .Release.Name }}-default-deny-cross-namespace"
  labels:
    app.kubernetes.io/name: cfi-platform
    app.kubernetes.io/instance: "{{ .Release.Name }}"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
