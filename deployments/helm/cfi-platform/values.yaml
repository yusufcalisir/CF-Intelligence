# CFI Platform — Production Hardened Helm Values
# Override per-environment using: helm install cfi-platform . -f values-prod.yaml

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "gp3"

# ─── Coordinator Service (Central FL Coordinator) ─────────────────────────────
coordinator:
  replicas: 2
  image:
    repository: cfi-platform/coordinator
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 5
  service:
    type: ClusterIP
    grpcPort: 50051
    httpPort: 8080
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ─── Fraud Alert Service ──────────────────────────────────────────────────────
fraudAlert:
  replicas: 2
  image:
    repository: cfi-platform/fraud-alert
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5
  service:
    type: ClusterIP
    httpPort: 8082
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# ─── Identity Graph Service ───────────────────────────────────────────────────
identityGraph:
  replicas: 1
  image:
    repository: cfi-platform/identity-graph
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
  service:
    type: ClusterIP
    httpPort: 8083
  autoscaling:
    enabled: false

# ─── Aggregator (Central FL Legacy) ───────────────────────────────────────────
aggregator:
  replicaCount: 2
  image:
    repository: cfi-platform/aggregator
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# ─── Bank Nodes (FL Clients) ──────────────────────────────────────────────────
bankNode:
  replicaCount: 3
  image:
    repository: cfi-platform/bank-node
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

# ─── Database (PostgreSQL) ────────────────────────────────────────────────────
database:
  url: "postgresql://cfi_user:changeme@postgresql:5432/cfi_platform"
  secretName: cfi-db-credentials

# ─── Redis Feature Store ──────────────────────────────────────────────────────
redis:
  enabled: true
  url: "redis://redis-master:6379/0"
  secretName: cfi-redis-credentials

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.cfi-platform.org
      paths:
        - path: /
          pathType: Prefix
          service: coordinator
  tls:
    - secretName: cfi-tls-cert
      hosts:
        - api.cfi-platform.org
