apiVersion: v1
kind: Service
metadata:
  name: "cfi-platform-service"
  labels:
    app.kubernetes.io/name: cfi-platform
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: cfi-platform
