replicaCount: 1

image:
  repository: cfi-intelligence/backend
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "cfi-platform-sa"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /app/storage
  existingClaim: ""

existingSecret: "cfi-platform-secrets"

service:
  type: ClusterIP
  port: 8000
  grpcPort: 50051

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/limit-rps: "500"
  hosts:
    - host: cfi.bank-consortium.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cfi-tls-cert
      hosts:
        - cfi.bank-consortium.org

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5

env:
  APP_ENV: production
  REDIS_URL: "redis://cfi-redis:6379/0"
  TELEMETRY_ENABLED: "true"
