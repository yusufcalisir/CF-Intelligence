name: Build & Publish Python SDK to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
    paths:
      - 'sdk/python/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build Python SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install SDK Dependencies & Build Tools
        run: |
          cd sdk/python
          python -m pip install --upgrade pip
          pip install build twine pytest
          pip install -e .[dev]

      - name: Run SDK Pytest Suite
        run: |
          cd sdk/python
          pytest -v

      - name: Build Wheel & Source Distribution
        run: |
          cd sdk/python
          python -m build

      - name: Check Package Artifacts with Twine
        run: |
          cd sdk/python
          twine check dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk-dist
          path: sdk/python/dist/

  publish-pypi:
    name: Publish Package to PyPI
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-sdk-dist
          path: dist

      - name: Publish to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
