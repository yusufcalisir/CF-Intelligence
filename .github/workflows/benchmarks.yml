name: Reproducible Empirical Benchmarks Suite

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: 'Dataset to evaluate (paysim, ieee_cis, credit_card, elliptic, amlsim, synthaml, amlnet, cross_bank, all)'
        required: true
        default: 'all'
      rounds:
        description: 'Number of federated training rounds'
        required: true
        default: '10'
      concurrency_limit:
        description: 'Maximum concurrency load for latency harness'
        required: true
        default: '500'
      seeds:
        description: 'Random seeds for multi-seed robustness (space-separated)'
        required: false
        default: '42 123'
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  run-benchmarks:
    name: Execute Empirical Benchmarks & Performance Harness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -r backend/requirements.txt matplotlib scikit-learn seaborn

      - name: Run Canonical Fraud Detection Benchmarks
        run: |
          python benchmarks/runners/run_fraud_benchmark.py --dataset paysim --synthetic-eval
          python benchmarks/runners/run_fraud_benchmark.py --dataset ieee_cis --synthetic-eval
          python benchmarks/runners/run_creditcard_benchmark.py --synthetic-eval --output-dir experiments/credit_card/synthetic_smoke

      - name: Run Graph & AML Topology Benchmarks
        run: |
          python benchmarks/runners/run_graph_benchmark.py
          python benchmarks/runners/run_graphsage_benchmark.py
          python benchmarks/runners/run_amlsim_benchmark.py
          python benchmarks/runners/run_synthaml_benchmark.py
          python benchmarks/runners/run_amlnet_benchmark.py

      - name: Run Component Factorial Ablation Matrix ($2^4 = 16$ Grid)
        run: |
          python benchmarks/runners/run_factorial_ablation.py

      - name: Run Federated Learning Convergence & Dirichlet Sensitivity
        run: |
          python benchmarks/runners/run_fl_benchmark.py --rounds ${{ github.event.inputs.rounds || 10 }} --alpha 0.5
          python benchmarks/runners/run_dirichlet_sweep.py

      - name: Run Privacy & Robustness Security Frontiers
        run: |
          python benchmarks/runners/run_dp_tradeoff.py
          python benchmarks/runners/run_byzantine_benchmark.py

      - name: Run Inference Gateway Latency Harness
        run: |
          python benchmarks/runners/run_latency_benchmark.py --workers 50

      - name: Run Unified Experiment Harness (Multi-Seed Production Run)
        run: |
          python -m experiments.harness.runner --name ProductionFraudMLP --rounds 5 --seeds ${{ github.event.inputs.seeds || '42 123' }}

      - name: Generate Publication Charts & Visualizations
        run: |
          python scripts/generate_charts.py --include-experiments

      - name: Verify Master Benchmark Matrix & Artifact Schema
        run: |
          python benchmarks/generate_master_benchmark_matrix.py --verify-only || python -m pytest backend/tests/unit/test_master_benchmark_matrix.py -v

      - name: Archive Benchmark JSON & Chart Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-and-figures
          path: |
            benchmarks/results/raw/*.json
            benchmarks/results/reports/*.md
            experiments/results/**
            docs/figures/*.png
