name: Enterprise Security & Vulnerability Audit Pipeline

'on':
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly security audit at 02:00 UTC
    - cron: '0 2 * * *'

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  sast-static-analysis:
    name: SAST Static Analysis (Ruff, Mypy, Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: Install Linting & Security Tools (uv)
        run: |
          command -v uv >/dev/null 2>&1 || for i in 1 2 3; do pip install --retries 5 --timeout 60 uv==0.13.7 && break || sleep 5; done
          uv pip install --system ruff mypy bandit pydantic pydantic-settings types-PyYAML

      - name: Ruff Lint Check
        run: ruff check app/ tests/

      - name: Mypy Strict Type Check
        run: mypy app/ --ignore-missing-imports

      - name: Bandit SAST Code Security Scan
        run: bandit -r app/ -ll -ii --format txt

  dependency-security-audit:
    name: Dependency Vulnerability Audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend: pip-audit ──────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: Install pip-audit & uv
        run: |
          for i in 1 2 3; do pip install --retries 5 --timeout 60 pip-audit==2.10.1 && break || sleep 5; done
          command -v uv >/dev/null 2>&1 || for i in 1 2 3; do pip install --retries 5 --timeout 60 uv==0.13.7 && break || sleep 5; done

      - name: Run pip-audit Dependency Vulnerability Scan
        working-directory: backend
        run: |
          uv pip compile requirements.txt -o /tmp/requirements.lock --quiet
          python scripts/run_pip_audit.py -r /tmp/requirements.lock

      # ── Frontend: npm audit ─────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit (zero high/critical vulnerabilities)
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          echo "✅ npm audit passed – no high or critical vulnerabilities found."

  trivy-container-security:
    name: Backend Container CVE & Runtime Security Audit (Trivy + Runtime Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (avoid unauthenticated rate-limit timeouts)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true  # Best-effort — build still attempted if creds missing

      - name: Build Backend Container Image (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          command: docker build ./backend -t cfi-backend:ci

      - name: Verify Non-Root Permissions & Ray JAR Removal Inside Final Backend Image
        run: |
          docker run --rm --entrypoint /bin/sh cfi-backend:ci -ec '
            set -eu
            test "$(id -u)" = "1000"
            test ! -e /opt/venv/lib/python3.12/site-packages/ray/jars
            test ! -w /app
            test ! -w /opt/venv
            test -w /app/storage
            test -w /tmp/cfi_storage
            touch /app/storage/.perm_check && rm -f /app/storage/.perm_check
          '

      - name: Run Linux Container Ray Runtime Tests
        run: |
          docker run --rm --entrypoint "" \
            -e CFI_EXPECT_RAY_JARS_ABSENT=1 \
            -e PYTHONPATH=/app:/app/backend \
            -v "${{ github.workspace }}/backend/tests:/app/tests:ro" \
            cfi-backend:ci \
            /opt/venv/bin/python -m pytest /app/tests/unit/test_ray_runtime_functional.py -v

      - name: Audit Installed Packages in Final Backend Runtime Environment (/opt/venv)
        run: |
          for i in 1 2 3; do pip install --retries 5 --timeout 60 pip-audit==2.10.1 && break || sleep 5; done
          cid="$(docker create cfi-backend:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "${cid}:/opt/venv/lib/python3.12/site-packages" /tmp/runtime-site-packages
          python scripts/run_pip_audit.py \
            --path /tmp/runtime-site-packages \
            --strict \
            --format json \
            -o /tmp/backend_runtime_pip_audit.json

      - name: Trivy Backend Container Vulnerability Scan (Blocking CRITICAL & HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: 'cfi-backend:ci'
          format: 'table'
          exit-code: '1' # Blocking fail on ALL CRITICAL,HIGH findings (no ignore-unfixed)
          ignore-unfixed: false
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Prune Backend Container Image
        if: always()
        run: docker rmi cfi-backend:ci || true

  trivy-frontend-container-security:
    name: Frontend Container CVE Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (avoid unauthenticated rate-limit timeouts)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true  # Best-effort — build still attempted if creds missing

      - name: Build Frontend Container Image (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: docker build ./frontend -t cfi-frontend:ci

      - name: Trivy Frontend Container Vulnerability Scan (Blocking CRITICAL & HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: 'cfi-frontend:ci'
          format: 'table'
          exit-code: '1' # Blocking fail on ALL CRITICAL,HIGH findings (no ignore-unfixed)
          ignore-unfixed: false
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Prune Frontend Container Image
        if: always()
        run: docker rmi cfi-frontend:ci || true

  helm-and-terraform-security-audit:
    name: Infrastructure Security Audit (Helm & Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.1'

      - name: Helm Chart Lint & Security Check
        run: helm lint deployments/helm/cfi-platform/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate AWS Terraform Module
        run: |
          cd deployments/terraform/aws
          terraform init -backend=false
          terraform validate

      - name: Validate Azure Terraform Module
        run: |
          cd deployments/terraform/azure
          terraform init -backend=false
          terraform validate

      - name: Validate GCP Terraform Module
        run: |
          cd deployments/terraform/gcp
          terraform init -backend=false
          terraform validate

  pytest-security-and-compliance-suites:
    name: Security Evaluation & Compliance Test Suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"

      - name: Install dependencies (uv)
        run: |
          command -v uv >/dev/null 2>&1 || for i in 1 2 3; do pip install --retries 5 --timeout 60 uv==0.13.7 && break || sleep 5; done
          uv pip install --system -r requirements.txt

      - name: Run Full Pytest Suite across Security, Governance & Compliance
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml
