name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: 1. Static Analysis & Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        run: pip install uv

      - name: Install Dependencies
        run: uv pip install --system ruff bandit mypy

      - name: Run Ruff Linter
        run: ruff check backend/app/

      - name: Run Bandit Security Audit
        run: bandit -r backend/app/ -s B101,B311,B104 -ll -ii

  unit-and-integration-tests:
    name: 2. Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install uv
          uv pip install --system -r backend/requirements.txt pytest pytest-cov pytest-asyncio

      - name: Run Pytest Backend Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing

  scientific-verification-audit:
    name: 3. Scientific Verification Audit Suite
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install uv
          uv pip install --system -r backend/requirements.txt pytest hypothesis scipy torch

      - name: Run Subsystem Scientific Verification Audits
        env:
          PYTHONPATH: backend
        run: |
          pytest verification/ -v

      - name: Run FL Reference Verification Benchmarks
        env:
          PYTHONPATH: backend
        run: |
          python verification/federated_learning/tests/fl_reference_verification.py

  docker-build-check:
    name: 4. Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: cfi-intelligence/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
